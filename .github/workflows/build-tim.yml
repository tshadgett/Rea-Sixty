name: Build (Tim)

# Tim's personal branch: every push builds the Windows DLL only, so a change
# is ready to download in a few minutes without running the four-platform
# matrix. Frank's build.yml is untouched (it only runs on main, tags and PRs),
# so merging upstream into this branch never conflicts with this file.
on:
  push:
    branches: [tim]
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch libusb + hidapi
        shell: pwsh
        run: |
          curl.exe -L -o libusb.7z https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.7z
          7z x libusb.7z -o"${{ github.workspace }}/libusb"
          curl.exe -L -o hidapi.zip https://github.com/libusb/hidapi/releases/download/hidapi-0.15.0/hidapi-win.zip
          Expand-Archive -Path hidapi.zip -DestinationPath "${{ github.workspace }}/hidapi"

      - name: Configure
        run: >
          cmake -S extension -B extension/build
          -DLIBUSB_ROOT="${{ github.workspace }}/libusb"
          -DHIDAPI_ROOT="${{ github.workspace }}/hidapi"

      - name: Build
        run: cmake --build extension/build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reaper_rea-sixty.dll
          path: extension/build/Release/reaper_rea-sixty.dll
          if-no-files-found: error
